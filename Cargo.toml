[package]
name = "nuke"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Tower-style, extensible framework for trading/crypto websocket communication. Reacts to market events and dispatches apalis jobs."

[lib]
path = "src/lib.rs"

[[example]]
name = "arb_bot"
path = "examples/arb_bot/main.rs"

[dependencies]
nuke-derive = { path = "nuke-derive", version = "0.1.0" }

# Type-level + async core
async-trait = "0.1.83"
thiserror = "2.0"
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "sink",
] }
tokio = { version = "1.41", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "net",
] }
tokio-stream = "0.1"

# WebSocket transport
tokio-tungstenite = "0.29.0"

# JSON-RPC framing
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tower-style middleware (reserved for the EvmWsSource layer stack)
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# Job execution — apalis 1.x, internal to the Reactor adapter. Public API
# stays in nuke vocab and never exposes apalis types. Defaults bring in
# `sleep` (needed for the in-memory dequeue backend the Pipe adapter
# requires Clone on) plus tracing + retry/timeout layers.
apalis = "=1.0.0-rc.7"
# Direct dep so we can reach the `dequeue` backend module that apalis's
# meta-crate doesn't re-export.
apalis-core = "=1.0.0-rc.7"
# Pinned for the chained-reaction DAG path. Lands on the apalis seam once
# the persistent backend (its bounds require `MetadataExt<WorkflowContext>`
# which the in-memory dequeue's `()` context doesn't satisfy) is wired in
# the persistence-layer epic. Keeping it here so the version stays in lock
# with apalis itself.
apalis-workflow = "=0.1.0-rc.7"

# EVM types and ABI codegen (transport is nuke's own; alloy is for primitives + sol!)
alloy-primitives = { version = "1.5", features = ["serde"] }
alloy-sol-types = "1.5"

# Domain primitives — Decimal everywhere, never f64 (see ROADMAP).
rust_decimal = { version = "1.41", features = ["serde"] }

# Rule registry: distributed-slice registration for compile-time enumeration
# of every `RuleId` (CI uniqueness check + markdown coverage).
linkme = "0.3.36"

# eDSL backends: CBOR + SHA-2 for the versioned wire format.
ciborium = "0.2.2"
sha2 = "0.11.0"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Secrets (consumed by the example, not by the library)
secretspec = "0.8.2"
secretspec-derive = "0.8.2"
secrecy = "0.10.3"

[dev-dependencies]
tokio = { version = "1.41", features = ["full", "test-util"] }
trybuild = "1.0.116"
