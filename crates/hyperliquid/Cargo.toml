[package]
name = "hyperliquid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hyperliquid Source / TradingVenue adapter for the nuke framework. Wraps hyperliquid_rust_sdk behind nuke's Subject / Venue / TradingVenue traits."

[lib]
path = "src/lib.rs"

[dependencies]
nuke.workspace = true

# The official Hyperliquid SDK does the wire / auth / EIP-712 work.
# We adapt its types to nuke's traits; we do not re-implement what
# it provides.
hyperliquid_rust_sdk.workspace = true

# Async + traits
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

# Serde (for the per-Subject Id / event types we expose)
serde.workspace = true

# Domain primitives - Decimal everywhere, never f64.
rust_decimal.workspace = true

# Error wrapping
thiserror.workspace = true

# Observability
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
