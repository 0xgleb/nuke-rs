name: "CI"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - master

jobs:
  checks:
    permissions:
      checks: write
      contents: read
      id-token: write
      packages: write
      pull-requests: write
      repository-projects: write

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        check:
        - workspace-build
        - workspace-test
        - workspace-clippy
        - pre-commit
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v5
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - uses: DeterminateSystems/flake-checker-action@main

    # Build each check derivation directly via `nix build`. Avoids
    # `nix flake check` (which evaluates devenv's `--impure`-only
    # devShell) and lets each crane derivation cache independently in
    # the nix binary cache.
    #
    # No `--print-build-logs`: that flag streams every compile line,
    # which buries the actual error when something fails. Without it
    # Nix stays quiet on success and surfaces just the failed
    # derivation's stderr tail on failure.
    - name: "build check: ${{ matrix.check }}"
      run: nix build --accept-flake-config ".#checks.x86_64-linux.${{ matrix.check }}"

    # On failure, GitHub's UI truncates the previous step's stdout
    # because `nix build` streams `building '/nix/store/...drv'`
    # lines for every dep. Nix's own "Last 25 log lines" tail with
    # the cargo error gets buried near the truncation cliff. Re-print
    # just the last 100 lines of the failed derivation's build log
    # as a small dedicated step so the actual error is always
    # visible at the END of the workflow log (where GitHub doesn't
    # truncate). Also emit a `::error::` annotation for each cargo
    # `error[Exxxx]:` line so the GitHub Checks UI surfaces them.
    - name: "tail derivation log on failure"
      if: failure()
      run: |
        log=$(nix log ".#checks.x86_64-linux.${{ matrix.check }}" 2>/dev/null || true)
        if [ -z "$log" ]; then
          echo "(no derivation log available)"
          exit 0
        fi
        printf '%s\n' "$log" | tail -n 100
        printf '%s\n' "$log" \
          | grep -oE 'error(\[E[0-9]+\])?: [^[:cntrl:]]+' \
          | sort -u \
          | head -10 \
          | while IFS= read -r line; do echo "::error::${line}"; done
