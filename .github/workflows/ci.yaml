name: "CI"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - master

# CI runs cargo directly via rustup-installed toolchain instead of
# through the nix flake's crane-based checks. The flake checks work
# locally (and on Darwin), but on Linux GitHub runners the crane
# `cargoArtifacts` cache reproducibly produces a `secretspec_derive`
# proc-macro `.so` that `rustc` can't load (`E0463 "can't find
# crate"`), even when the deps phase compiled it cleanly. Plain
# rustup + cargo sidesteps the entire crane / nix-sandbox /
# proc-macro interaction and runs in ~3 min instead of ~9 min for
# the deps phase alone. The flake checks remain wired up for local
# `nix flake check`; they are not the CI source of truth.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  cargo-checks:
    name: cargo ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - kind: build
          command: cargo build --workspace --all-targets --locked
        - kind: test
          command: cargo test --workspace --all-targets --locked
        - kind: clippy
          command: cargo clippy --workspace --all-targets --locked -- -D warnings
    steps:
    - uses: actions/checkout@v5

    # The toolchain version is read from `rust-toolchain.toml` if
    # present; otherwise dtolnay/rust-toolchain falls back to the
    # `toolchain` arg below. We pin to nightly so the workspace's
    # `edition = "2024"` resolves consistently with local Darwin
    # builds via fenix.
    - name: install rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2026-05-02
        components: clippy, rustfmt

    - name: cache cargo registry + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.kind }}

    - name: ${{ matrix.command }}
      run: ${{ matrix.command }}

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main

    # Pre-commit hooks (rustfmt, nixfmt, taplo, denofmt, actionlint)
    # are wired in the flake. Run them via `nix build` of the
    # `pre-commit` check so the hook environment matches local dev.
    - name: pre-commit
      run: nix build --accept-flake-config '.#checks.x86_64-linux.pre-commit'

    - name: tail pre-commit log on failure
      if: failure()
      run: |
        log=$(nix log '.#checks.x86_64-linux.pre-commit' 2>/dev/null || true)
        if [ -n "$log" ]; then
          printf '%s\n' "$log" | tail -n 100
        fi
