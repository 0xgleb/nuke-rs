name: "CI"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - master

jobs:
  checks:
    permissions:
      checks: write
      contents: read
      id-token: write
      packages: write
      pull-requests: write
      repository-projects: write

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        check:
        - workspace-build
        - workspace-test
        - workspace-clippy
        - pre-commit
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v5
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - uses: DeterminateSystems/flake-checker-action@main

    # Build each check derivation directly via `nix build`. Avoids
    # `nix flake check` (which evaluates devenv's `--impure`-only
    # devShell) and lets each crane derivation cache independently in
    # the nix binary cache.
    #
    # No `--print-build-logs`: that flag streams every compile line,
    # which buries the actual error when something fails. Without it
    # Nix stays quiet on success and surfaces just the failed
    # derivation's stderr tail on failure.
    - name: "build check: ${{ matrix.check }}"
      run: nix build --accept-flake-config ".#checks.x86_64-linux.${{ matrix.check }}"

    # On failure, surface the failed derivation's stderr in full so
    # the GitHub Actions log includes the cargo error context that
    # `nix build`'s tail summary truncates.
    - name: "show full log on failure"
      if: failure()
      run: nix log ".#checks.x86_64-linux.${{ matrix.check }}" || true
